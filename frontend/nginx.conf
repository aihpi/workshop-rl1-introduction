# Serves the static bundle and proxies /api/ to the backend container,
# so the browser stays single-origin (no CORS, hostname-agnostic:
# localhost, LAN IP, Tailscale - all work; GitHub issue #4).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_buffering off;      # critical for the SSE train/play/eval streams
        proxy_read_timeout 3600s; # training streams stay open for minutes
        proxy_set_header Host $host;
    }
}
