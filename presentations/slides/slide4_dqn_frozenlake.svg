<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="8" fill="#ff7500"/>

  <text x="90" y="110" font-size="56" font-weight="700" fill="#2d2d2d">DQN on FrozenLake: same picture, different machinery</text>
  <text x="90" y="165" font-size="30" fill="#666666">FrozenLake has only 16 states — so we can ask the network all 16 questions and draw its answers as a table</text>

  <!-- Left: one-hot input -> network -> 4 outputs -->
  <text x="90" y="265" font-size="30" font-weight="700" fill="#ff7500">HOW THE NETWORK SEES A STATE</text>

  <text x="90" y="330" font-size="27" fill="#2d2d2d">State 14 becomes a <tspan font-weight="700">one-hot vector</tspan>:</text>
  <!-- one-hot vector -->
  <g transform="translate(90, 360)">
    <g stroke="#cccccc" stroke-width="2" fill="#ffffff">
      <rect x="0" y="0" width="44" height="44"/><rect x="44" y="0" width="44" height="44"/><rect x="88" y="0" width="44" height="44"/><rect x="132" y="0" width="44" height="44"/>
      <rect x="176" y="0" width="44" height="44"/><rect x="220" y="0" width="44" height="44"/><rect x="264" y="0" width="44" height="44"/><rect x="308" y="0" width="44" height="44"/>
      <rect x="352" y="0" width="44" height="44"/><rect x="396" y="0" width="44" height="44"/><rect x="440" y="0" width="44" height="44"/><rect x="484" y="0" width="44" height="44"/>
      <rect x="528" y="0" width="44" height="44"/><rect x="572" y="0" width="44" height="44"/><rect x="660" y="0" width="44" height="44"/>
    </g>
    <rect x="616" y="0" width="44" height="44" fill="#ff7500"/>
    <g font-size="24" fill="#888888" text-anchor="middle">
      <text x="22" y="30">0</text><text x="66" y="30">0</text><text x="110" y="30">0</text><text x="154" y="30">0</text>
      <text x="198" y="30">0</text><text x="242" y="30">0</text><text x="286" y="30">0</text><text x="330" y="30">0</text>
      <text x="374" y="30">0</text><text x="418" y="30">0</text><text x="462" y="30">0</text><text x="506" y="30">0</text>
      <text x="550" y="30">0</text><text x="594" y="30">0</text><text x="682" y="30">0</text>
    </g>
    <text x="638" y="30" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
    <text x="638" y="80" font-size="22" fill="#ff7500" text-anchor="middle" font-weight="600">index 14</text>
  </g>

  <!-- network -->
  <g transform="translate(190, 500)">
    <rect x="0" y="0" width="180" height="200" rx="12" fill="#f4f1fa" stroke="#7664a0" stroke-width="3"/>
    <text x="90" y="90" font-size="26" fill="#7664a0" text-anchor="middle" font-weight="600">hidden</text>
    <text x="90" y="124" font-size="26" fill="#7664a0" text-anchor="middle" font-weight="600">64 × 64</text>
    <path d="M 210 100 L 290 100" stroke="#2d2d2d" stroke-width="5" fill="none" marker-end="url(#arrD)"/>
    <!-- outputs -->
    <g font-size="26" fill="#2d2d2d">
      <rect x="310" y="-10"  width="220" height="48" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
      <rect x="310" y="52" width="220" height="48" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
      <rect x="310" y="114" width="220" height="48" rx="8" fill="#fff4ea" stroke="#ff7500" stroke-width="3"/>
      <rect x="310" y="176" width="220" height="48" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
      <text x="330" y="22">Q(14, ←) = 0.28</text>
      <text x="330" y="84">Q(14, ↓) = 0.44</text>
      <text x="330" y="146" font-weight="700" fill="#c65600">Q(14, →) = 1.00</text>
      <text x="330" y="208">Q(14, ↑) = 0.12</text>
    </g>
    <path d="M -60 100 L -20 100" stroke="#2d2d2d" stroke-width="5" fill="none" marker-end="url(#arrD)"/>
  </g>

  <text x="90" y="800" font-size="27" fill="#444444">Repeat for all 16 states → 16 rows of 4 values:</text>
  <text x="90" y="836" font-size="27" fill="#444444">the network <tspan font-weight="700">read out as the familiar Q-table</tspan> (what RL Lab shows).</text>

  <!-- Right: table vs network contrast -->
  <text x="1000" y="265" font-size="30" font-weight="700" fill="#7664a0">TABLE vs NETWORK — WHAT CHANGES</text>

  <rect x="1000" y="290" width="830" height="300" rx="12" fill="#f7f7f7"/>
  <text x="1035" y="345" font-size="28" font-weight="700" fill="#2d2d2d">Q-Learning's table</text>
  <text x="1035" y="393" font-size="27" fill="#444444">· every cell stored independently</text>
  <text x="1035" y="435" font-size="27" fill="#444444">· an update touches exactly ONE cell</text>
  <text x="1035" y="477" font-size="27" fill="#444444">· values spread slowly, cell by cell</text>
  <text x="1035" y="519" font-size="27" fill="#444444">· untouched cells keep their init forever</text>

  <rect x="1000" y="620" width="830" height="300" rx="12" fill="#f4f1fa" stroke="#7664a0" stroke-width="3"/>
  <text x="1035" y="675" font-size="28" font-weight="700" fill="#7664a0">DQN's network</text>
  <text x="1035" y="723" font-size="27" fill="#444444">· all 64 values computed from SHARED weights</text>
  <text x="1035" y="765" font-size="27" fill="#444444">· every gradient step moves ALL values a little</text>
  <text x="1035" y="807" font-size="27" fill="#444444">· values move in avalanches (generalization)</text>
  <text x="1035" y="849" font-size="27" fill="#444444">· terminal states show meaningless extrapolation</text>
  <text x="1035" y="891" font-size="27" fill="#444444">&#160;&#160;— they are never trained, never used</text>

  <rect x="90" y="980" width="1740" height="4" fill="#eeeeee"/>
  <text x="90" y="1035" font-size="28" fill="#ff7500" font-weight="600">Watch it live in RL Lab: train Q-Learning, then DQN, on FrozenLake — same table display, very different motion.</text>

  <defs>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2d2d2d"/></marker>
  </defs>
</svg>
