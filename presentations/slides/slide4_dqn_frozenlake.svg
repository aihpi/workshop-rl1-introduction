<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="90" y="110" font-size="56" font-weight="700" fill="#2d2d2d">DQN on FrozenLake</text>
  <text x="90" y="165" font-size="30" fill="#666666">Only 16 states — ask the network all 16 questions, draw the answers as a table</text>

  <!-- one-hot input -->
  <text x="90" y="290" font-size="28" fill="#2d2d2d">state 14 as a <tspan font-weight="700">one-hot vector</tspan>:</text>
  <g transform="translate(90, 320)">
    <g stroke="#cccccc" stroke-width="2" fill="#ffffff">
      <rect x="0" y="0" width="44" height="44"/><rect x="44" y="0" width="44" height="44"/><rect x="88" y="0" width="44" height="44"/><rect x="132" y="0" width="44" height="44"/>
      <rect x="176" y="0" width="44" height="44"/><rect x="220" y="0" width="44" height="44"/><rect x="264" y="0" width="44" height="44"/><rect x="308" y="0" width="44" height="44"/>
      <rect x="352" y="0" width="44" height="44"/><rect x="396" y="0" width="44" height="44"/><rect x="440" y="0" width="44" height="44"/><rect x="484" y="0" width="44" height="44"/>
      <rect x="528" y="0" width="44" height="44"/><rect x="572" y="0" width="44" height="44"/><rect x="660" y="0" width="44" height="44"/>
    </g>
    <rect x="616" y="0" width="44" height="44" fill="#2d2d2d"/>
    <g font-size="24" fill="#999999" text-anchor="middle">
      <text x="22" y="30">0</text><text x="66" y="30">0</text><text x="110" y="30">0</text><text x="154" y="30">0</text>
      <text x="198" y="30">0</text><text x="242" y="30">0</text><text x="286" y="30">0</text><text x="330" y="30">0</text>
      <text x="374" y="30">0</text><text x="418" y="30">0</text><text x="462" y="30">0</text><text x="506" y="30">0</text>
      <text x="550" y="30">0</text><text x="594" y="30">0</text><text x="682" y="30">0</text>
    </g>
    <text x="638" y="30" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
    <text x="638" y="80" font-size="22" fill="#555555" text-anchor="middle" font-weight="600">index 14</text>
  </g>

  <!-- network -->
  <g transform="translate(190, 500)">
    <path d="M -60 100 L -20 100" stroke="#2d2d2d" stroke-width="5" fill="none" marker-end="url(#arrD)"/>
    <rect x="0" y="0" width="180" height="200" rx="12" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="3"/>
    <text x="90" y="90" font-size="26" fill="#555555" text-anchor="middle" font-weight="600">hidden</text>
    <text x="90" y="124" font-size="26" fill="#555555" text-anchor="middle" font-weight="600">64 × 64</text>
    <path d="M 210 100 L 290 100" stroke="#2d2d2d" stroke-width="5" fill="none" marker-end="url(#arrD)"/>
    <g font-size="26" fill="#2d2d2d">
      <rect x="310" y="-10"  width="220" height="48" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
      <rect x="310" y="52" width="220" height="48" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
      <rect x="310" y="114" width="220" height="48" rx="8" fill="#ffffff" stroke="#ff7500" stroke-width="3"/>
      <rect x="310" y="176" width="220" height="48" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
      <text x="330" y="22">Q(14, ←) = 0.28</text>
      <text x="330" y="84">Q(14, ↓) = 0.44</text>
      <text x="330" y="146" font-weight="700" fill="#ff7500">Q(14, →) = 1.00</text>
      <text x="330" y="208">Q(14, ↑) = 0.12</text>
    </g>
  </g>

  <text x="90" y="820" font-size="28" fill="#2d2d2d">All 16 states → <tspan font-weight="700">the familiar Q-table</tspan> <tspan fill="#888888">(what RL Lab shows)</tspan></text>

  <!-- Right: table vs network contrast -->
  <rect x="1000" y="290" width="830" height="250" rx="12" fill="#ffffff" stroke="#bbbbbb" stroke-width="3"/>
  <text x="1035" y="345" font-size="30" font-weight="700" fill="#2d2d2d">Q-Learning's table</text>
  <text x="1035" y="400" font-size="28" fill="#555555">· every cell independent</text>
  <text x="1035" y="445" font-size="28" fill="#555555">· one update touches one cell</text>
  <text x="1035" y="490" font-size="28" fill="#555555">· values spread cell by cell</text>

  <rect x="1000" y="580" width="830" height="250" rx="12" fill="#f7f7f7"/>
  <text x="1035" y="635" font-size="30" font-weight="700" fill="#2d2d2d">DQN's network</text>
  <text x="1035" y="690" font-size="28" fill="#555555">· all values share the weights</text>
  <text x="1035" y="735" font-size="28" fill="#555555">· every update moves ALL values</text>
  <text x="1035" y="780" font-size="28" fill="#555555">· terminal states: never trained, never used</text>

  <text x="1000" y="890" font-size="28" fill="#2d2d2d" font-weight="600">Same table on screen — very different motion.</text>

  <defs>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2d2d2d"/></marker>
  </defs>
</svg>
