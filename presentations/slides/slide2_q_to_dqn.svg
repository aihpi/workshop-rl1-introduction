<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="90" y="110" font-size="56" font-weight="700" fill="#2d2d2d">From Q-Learning to DQN</text>
  <text x="90" y="165" font-size="30" fill="#666666">Same idea, same update — a network estimates Q(s, a)</text>

  <!-- Problem -->
  <rect x="90" y="250" width="520" height="190" rx="12" fill="#f7f7f7"/>
  <text x="120" y="305" font-size="28" fill="#2d2d2d">CartPole: 4 continuous numbers</text>
  <text x="120" y="355" font-size="28" fill="#2d2d2d">→ infinitely many states</text>
  <text x="120" y="405" font-size="28" font-weight="700" fill="#2d2d2d">→ no table can hold them</text>

  <!-- The swap: table -> network -->
  <g transform="translate(90, 560)">
    <g stroke="#cccccc" stroke-width="2" fill="#ffffff">
      <rect x="0" y="0" width="70" height="45"/><rect x="70" y="0" width="70" height="45"/><rect x="140" y="0" width="70" height="45"/>
      <rect x="0" y="45" width="70" height="45"/><rect x="70" y="45" width="70" height="45"/><rect x="140" y="45" width="70" height="45"/>
      <rect x="0" y="90" width="70" height="45"/><rect x="70" y="90" width="70" height="45"/><rect x="140" y="90" width="70" height="45"/>
    </g>
    <line x1="-15" y1="150" x2="225" y2="-15" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
    <line x1="-15" y1="-15" x2="225" y2="150" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <path d="M 340 627 L 420 627" stroke="#2d2d2d" stroke-width="5" fill="none" marker-end="url(#arrD)"/>

  <!-- network -->
  <g transform="translate(480, 520)">
    <circle cx="0" cy="20" r="14" fill="#555555"/>
    <circle cx="0" cy="75" r="14" fill="#555555"/>
    <circle cx="0" cy="130" r="14" fill="#555555"/>
    <circle cx="0" cy="185" r="14" fill="#555555"/>
    <circle cx="125" cy="0" r="14" fill="#aaaaaa"/>
    <circle cx="125" cy="55" r="14" fill="#aaaaaa"/>
    <circle cx="125" cy="110" r="14" fill="#aaaaaa"/>
    <circle cx="125" cy="165" r="14" fill="#aaaaaa"/>
    <circle cx="125" cy="220" r="14" fill="#aaaaaa"/>
    <circle cx="250" cy="55" r="14" fill="#ff7500"/>
    <circle cx="250" cy="150" r="14" fill="#ff7500"/>
    <g stroke="#dddddd" stroke-width="2">
      <line x1="14" y1="20" x2="111" y2="0"/><line x1="14" y1="20" x2="111" y2="55"/><line x1="14" y1="20" x2="111" y2="110"/><line x1="14" y1="20" x2="111" y2="165"/><line x1="14" y1="20" x2="111" y2="220"/>
      <line x1="14" y1="75" x2="111" y2="0"/><line x1="14" y1="75" x2="111" y2="55"/><line x1="14" y1="75" x2="111" y2="110"/><line x1="14" y1="75" x2="111" y2="165"/><line x1="14" y1="75" x2="111" y2="220"/>
      <line x1="14" y1="130" x2="111" y2="0"/><line x1="14" y1="130" x2="111" y2="55"/><line x1="14" y1="130" x2="111" y2="110"/><line x1="14" y1="130" x2="111" y2="165"/><line x1="14" y1="130" x2="111" y2="220"/>
      <line x1="14" y1="185" x2="111" y2="0"/><line x1="14" y1="185" x2="111" y2="55"/><line x1="14" y1="185" x2="111" y2="110"/><line x1="14" y1="185" x2="111" y2="165"/><line x1="14" y1="185" x2="111" y2="220"/>
      <line x1="139" y1="0" x2="236" y2="55"/><line x1="139" y1="55" x2="236" y2="55"/><line x1="139" y1="110" x2="236" y2="55"/><line x1="139" y1="165" x2="236" y2="55"/><line x1="139" y1="220" x2="236" y2="55"/>
      <line x1="139" y1="0" x2="236" y2="150"/><line x1="139" y1="55" x2="236" y2="150"/><line x1="139" y1="110" x2="236" y2="150"/><line x1="139" y1="165" x2="236" y2="150"/><line x1="139" y1="220" x2="236" y2="150"/>
    </g>
    <text x="0" y="-30" font-size="24" fill="#555555" text-anchor="middle" font-weight="600">state</text>
    <text x="278" y="62" font-size="24" fill="#ff7500" font-weight="600">Q(s, a₁)</text>
    <text x="278" y="157" font-size="24" fill="#ff7500" font-weight="600">Q(s, a₂)</text>
  </g>

  <rect x="90" y="830" width="800" height="150" rx="12" fill="#f7f7f7"/>
  <text x="120" y="878" font-size="27" fill="#2d2d2d">Same update rule, as a <tspan font-weight="700">gradient step</tspan>:&#160;&#160;loss = ( target − Q(s,a) )²</text>
  <text x="120" y="920" font-size="26" fill="#555555">backpropagation carries the error backwards through the layers —</text>
  <text x="120" y="956" font-size="26" fill="#555555">every weight is nudged in proportion to its share of the error</text>

  <!-- Right: the two tricks -->
  <text x="950" y="285" font-size="30" font-weight="700" fill="#2d2d2d">TWO TRICKS MAKE IT STABLE</text>

  <rect x="950" y="315" width="880" height="215" rx="12" fill="#ffffff" stroke="#bbbbbb" stroke-width="3"/>
  <text x="985" y="370" font-size="34" font-weight="700" fill="#2d2d2d">1&#160;&#160;Replay Buffer</text>
  <text x="985" y="420" font-size="27" fill="#555555">a memory of experiences (s, a, r, s') — train on random batches</text>
  <text x="985" y="490" font-size="27" fill="#2d2d2d">→ one lucky success teaches the network thousands of times</text>

  <rect x="950" y="570" width="880" height="215" rx="12" fill="#ffffff" stroke="#bbbbbb" stroke-width="3"/>
  <text x="985" y="625" font-size="34" font-weight="700" fill="#2d2d2d">2&#160;&#160;Target Network</text>
  <text x="985" y="675" font-size="27" fill="#555555">a frozen copy computes the targets r + γ · max Q<tspan font-size="20" baseline-shift="sub">target</tspan>(s', a')</text>
  <text x="985" y="745" font-size="27" fill="#2d2d2d">→ no chasing your own moving estimates</text>

  <rect x="950" y="825" width="880" height="100" rx="12" fill="#f7f7f7"/>
  <text x="985" y="885" font-size="27" fill="#2d2d2d"><tspan font-weight="700">Shared weights:</tspan> every update moves ALL states a little</text>

  <text x="90" y="1040" font-size="30" fill="#2d2d2d" font-weight="600">DQN&#160;&#160;=&#160;&#160;Q-Learning&#160;&#160;+&#160;&#160;network&#160;&#160;+&#160;&#160;replay buffer&#160;&#160;+&#160;&#160;target network</text>

  <defs>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2d2d2d"/></marker>
  </defs>
</svg>
