<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="90" y="100" font-size="56" font-weight="700" fill="#2d2d2d">Q-Learning on FrozenLake</text>

  <!-- Update rule -->
  <rect x="90" y="140" width="1740" height="120" rx="14" fill="#f7f7f7"/>
  <text x="130" y="215" font-size="40" font-weight="600" fill="#2d2d2d">Q(s,a) ← Q(s,a) + α · [ target − Q(s,a) ]</text>
  <text x="1790" y="200" font-size="30" fill="#555555" text-anchor="end">target = r + γ · max Q(s', a')</text>
  <text x="1790" y="240" font-size="26" fill="#888888" text-anchor="end">just r if the episode ended</text>

  <text x="90" y="315" font-size="26" fill="#888888">α = 0.1&#160;&#160;·&#160;&#160;γ = 0.95&#160;&#160;·&#160;&#160;reward: +1 at the goal, else 0&#160;&#160;·&#160;&#160;table starts at 0</text>

  <!-- FrozenLake grid -->
  <g transform="translate(90, 360)">
    <g stroke="#ffffff" stroke-width="6">
      <rect x="0"   y="0"   width="140" height="140" fill="#dbeafe"/>
      <rect x="140" y="0"   width="140" height="140" fill="#dbeafe"/>
      <rect x="280" y="0"   width="140" height="140" fill="#dbeafe"/>
      <rect x="420" y="0"   width="140" height="140" fill="#dbeafe"/>
      <rect x="0"   y="140" width="140" height="140" fill="#dbeafe"/>
      <rect x="140" y="140" width="140" height="140" fill="#1e3a5f"/>
      <rect x="280" y="140" width="140" height="140" fill="#dbeafe"/>
      <rect x="420" y="140" width="140" height="140" fill="#1e3a5f"/>
      <rect x="0"   y="280" width="140" height="140" fill="#dbeafe"/>
      <rect x="140" y="280" width="140" height="140" fill="#dbeafe"/>
      <rect x="280" y="280" width="140" height="140" fill="#dbeafe"/>
      <rect x="420" y="280" width="140" height="140" fill="#1e3a5f"/>
      <rect x="0"   y="420" width="140" height="140" fill="#1e3a5f"/>
      <rect x="140" y="420" width="140" height="140" fill="#dbeafe"/>
      <rect x="280" y="420" width="140" height="140" fill="#dbeafe"/>
      <rect x="420" y="420" width="140" height="140" fill="#7bb662"/>
    </g>
    <g font-size="22" fill="#666666">
      <text x="10" y="28">0</text><text x="150" y="28">1</text><text x="290" y="28">2</text><text x="430" y="28">3</text>
      <text x="10" y="168">4</text><text x="150" y="168" fill="#9fb6cc">5</text><text x="290" y="168">6</text><text x="430" y="168" fill="#9fb6cc">7</text>
      <text x="10" y="308">8</text><text x="150" y="308">9</text><text x="290" y="308">10</text><text x="430" y="308" fill="#9fb6cc">11</text>
      <text x="10" y="448" fill="#9fb6cc">12</text><text x="150" y="448">13</text><text x="290" y="448">14</text><text x="430" y="448" fill="#ffffff">15</text>
    </g>
    <text x="70"  y="88"  font-size="40" font-weight="700" fill="#2d2d2d" text-anchor="middle">S</text>
    <text x="210" y="228" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">H</text>
    <text x="490" y="228" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">H</text>
    <text x="490" y="368" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">H</text>
    <text x="70"  y="508" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">H</text>
    <text x="490" y="508" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">G</text>
    <!-- update arrows -->
    <path d="M 360 490 L 410 490" stroke="#ff7500" stroke-width="8" fill="none" marker-end="url(#arrO)"/>
    <path d="M 220 490 L 270 490" stroke="#7664a0" stroke-width="8" fill="none" marker-end="url(#arrV)"/>
    <circle cx="335" cy="490" r="11" fill="#ff7500"/>
    <circle cx="195" cy="490" r="11" fill="#7664a0"/>
  </g>

  <!-- Update 1 -->
  <text x="800" y="395" font-size="30" font-weight="700" fill="#ff7500">UPDATE 1 — REACHING THE GOAL</text>
  <rect x="800" y="420" width="1030" height="200" rx="12" fill="#fff4ea" stroke="#ff7500" stroke-width="3"/>
  <text x="835" y="475" font-size="28" fill="#2d2d2d">state <tspan font-weight="700">14</tspan>, action <tspan font-weight="700">→</tspan> :&#160;&#160;r = 1, episode ends</text>
  <text x="835" y="525" font-size="28" fill="#2d2d2d">target = <tspan font-weight="700">1</tspan></text>
  <text x="835" y="585" font-size="30" fill="#2d2d2d">Q(14, →) ← 0 + 0.1 · (1 − 0) = <tspan font-weight="700" fill="#c65600">0.1</tspan></text>

  <!-- Update 2 -->
  <text x="800" y="700" font-size="30" font-weight="700" fill="#7664a0">UPDATE 2 — ONE STEP EARLIER</text>
  <rect x="800" y="725" width="1030" height="250" rx="12" fill="#f4f1fa" stroke="#7664a0" stroke-width="3"/>
  <text x="835" y="780" font-size="28" fill="#2d2d2d">state <tspan font-weight="700">13</tspan>, action <tspan font-weight="700">→</tspan> , lands in 14:&#160;&#160;r = 0</text>
  <text x="835" y="830" font-size="28" fill="#2d2d2d">max Q(14, ·) = 0.1&#160;&#160;&#160;<tspan fill="#888888">← from update 1</tspan></text>
  <text x="835" y="880" font-size="28" fill="#2d2d2d">target = 0 + 0.95 · 0.1 = <tspan font-weight="700">0.095</tspan></text>
  <text x="835" y="940" font-size="30" fill="#2d2d2d">Q(13, →) ← 0 + 0.1 · (0.095 − 0) = <tspan font-weight="700" fill="#7664a0">0.0095</tspan></text>

  <defs>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff7500"/></marker>
    <marker id="arrV" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7664a0"/></marker>
  </defs>
</svg>
