# Participant setup: self-contained images, no bind mounts.
#   docker compose pull   # get the latest images (needs network)
#   docker compose up -d  # run
#
# Maintainers: add the dev override for bind mounts + hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  # Backend service (Flask API)
  backend:
    image: davidgoll/workshop-rl1-backend:latest
    container_name: workshop-rl1-introduction-backend
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rl-network
    restart: unless-stopped

  # Frontend service (static React build served by nginx)
  frontend:
    image: davidgoll/workshop-rl1-frontend:latest
    container_name: workshop-rl1-introduction-frontend
    ports:
      - "3030:80"
    depends_on:
      - backend
    networks:
      - rl-network
    restart: unless-stopped

networks:
  rl-network:
    driver: bridge
