name: Build and Push Docker Images

on:
  # Manual trigger - click "Run workflow" in GitHub Actions tab
  workflow_dispatch:

  # Automatic trigger: the images carry the application code, so any
  # source change on main must rebuild them (participants pull, they
  # have no bind mounts)
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: davidgoll/workshop-rl1-backend:latest
          platforms: linux/amd64,linux/arm64
          # Registry cache (mode=max) also caches intermediate layers -
          # inline cache cannot, and rebuilding under qemu is expensive
          cache-from: type=registry,ref=davidgoll/workshop-rl1-backend:buildcache
          cache-to: type=registry,ref=davidgoll/workshop-rl1-backend:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: davidgoll/workshop-rl1-frontend:latest
          platforms: linux/amd64,linux/arm64
          # mode=max is essential here: it caches the npm ci / CRA build
          # stages, which a multi-stage inline cache would silently drop
          cache-from: type=registry,ref=davidgoll/workshop-rl1-frontend:buildcache
          cache-to: type=registry,ref=davidgoll/workshop-rl1-frontend:buildcache,mode=max
